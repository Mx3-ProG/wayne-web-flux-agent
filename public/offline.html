<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070708">
  <title>FLUX</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#070708}body{display:grid;place-items:center;overflow:hidden;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#070708}.loader:before{content:"";position:absolute;width:min(72vw,540px);aspect-ratio:1;border-radius:50%;background:rgb(239 35 60/.08);filter:blur(100px)}.lockup{position:relative;display:grid;justify-items:center}.word{display:flex;color:#f7f5f2;font-size:clamp(4.4rem,14vw,8.5rem);font-weight:900;letter-spacing:-.095em;line-height:.85}.word span{display:inline-block;opacity:0;filter:blur(8px);transform:translateX(110px);animation:arrive .52s cubic-bezier(.16,1,.3,1) forwards}.word span:first-child{color:#ef233c;animation-delay:.04s}.word span:nth-child(2){animation-delay:.18s}.word span:nth-child(3){animation-delay:.32s}.word span:nth-child(4){animation-delay:.46s}.mark{width:clamp(48px,8vw,70px);height:auto;margin-top:34px;opacity:0;transform:translateY(10px) scale(.9);animation:reveal .42s cubic-bezier(.16,1,.3,1) .76s forwards,breathe 1.8s ease-in-out 1.2s infinite}@keyframes arrive{to{opacity:1;filter:blur(0);transform:translateX(0)}}@keyframes reveal{to{opacity:1;transform:translateY(0) scale(1)}}@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.65;transform:scale(.96)}}@media(prefers-reduced-motion:reduce){.word span,.mark{opacity:1;filter:none;transform:none;animation:none}}
  </style>
</head>
<body>
  <main class="loader" aria-label="FLUX est prêt à reprendre dès le retour de la connexion">
    <div class="lockup" aria-hidden="true">
      <div class="word"><span>F</span><span>L</span><span>U</span><span>X</span></div>
      <img class="mark" src="/flux-symbol-light.png" width="70" height="47" alt="">
    </div>
  </main>
</body>
</html>
